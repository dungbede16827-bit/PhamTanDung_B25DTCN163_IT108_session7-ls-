<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        let sls = prompt("Số lượng sách trong thư viện là: ");

        if (sls <10 ) {
            console.log("Thư viện có ít sách");
            document.write("Thư viện có ít sách");
        } else if (sls <20 ) {
            document.write("Thư viện có số lượng sách vừa đủ");
            console.log("Thư viện có số lượng sách vừa đủ");
        } else {
            document.write("Thư viện có nhiều sách");
              console.log("Thư viện có nhiều sách");
        }

    </script>
</body>
</html>
