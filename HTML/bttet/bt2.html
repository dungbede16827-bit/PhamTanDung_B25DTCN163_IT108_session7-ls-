<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <script>
        //38. Viết một chương trình kiểm tra sự khác biệt giữa null và undefined.
        let a;
        let b = null;

        console.log("giá trị a : " , a);
        console.log("giá trị b: ",b);

        console.log("kiểu dữ liệu a:",typeof a);
        console.log("kiểu dữ liệu b:", typeof b);

        console.log("a == b: ", a==b);
        console.log("a == b: ",a === b);
    </script>
</body>
