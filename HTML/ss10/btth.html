<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let squad = [

    { id: 1, name: "Nguyen Van A", goals: 10, position: "FW" },

    { id: 2, name: "Tran Van B", goals: 5,  position: "MF" },

    { id: 3, name: "Le Van C",   goals: 0,  position: "DF" },

    { id: 4, name: "Pham Van D", goals: 12, position: "FW" },

    { id: 5, name: "Dang Van E", goals: 0,  position: "GK" }

];
let choice;
        do {
            choice = Number(prompt(`
                --- FOOTBALL MANAGER PRO ---

                1. Xem đội hình

                2. Thêm cầu thủ

                3. Tìm kiếm (theo ID)

                4. Cập nhật bàn thắng

                5. Xóa cầu thủ (Chuyển nhượng)

                0. Thoát
            `))
            switch(choice) {
                case 1:
                    squad.forEach((player) => {
                        console.log(`Mã ${player.id} - ${player.name}(${player.position}): ${player.goals} Bàn `);
                    })
                    break;
                case 2:
                let name = prompt("nhập tên cầu thủ :");
                let goals = Number(prompt("Nhập số bàn thắng:"));
                let position = prompt("vị trí cầu thủ chơi:");

                let id = squad.length +1;

                let newPlayer = {
                    id: id,
                    name: name,
                    goals: goals,
                    position: position
                };
                squad.push(newPlayer);

                console.log("Danh sách sau khi thêm:");
                console.log(squad);
                    break;
                case 3:
                    let searchName = Number(prompt("ID cầu thủ cầu xem"));
                    let foundPlayer = squad.find(player => player.id === searchName);
                    if(foundPlayer) {
                        console.log("Thông tin cầu thủ:");
                        console.log(foundPlayer);
                    } else {
                        console.log("Không tìm thấy");
                    }

                    break;
                case 4:
                    let inputId = Number(prompt("nhập Id cầu thủ vừa ghi bàn"));
                    let player = squad.find(player => player.id === inputId);
                    if(player) {
                        player.goals += 1;
                        console.log(`Đã cập nhật bàn thắng cho cầu thủ ${player.name} thành ${player.goals}`);
                    } else {
                        console.log("không tìm thấy cầu thủ");
                    }
                    break;
                case 5:
                    let inputDelete = Number(prompt("nhập Id cần xóa khỏi đội"));
                    let index = squad.findIndex(player => player.id === inputDelete);
                    if(index !== -1) {
                        let removedPlayer = squad.splice(index, 1);
                        console.log(`Đã chuyển nhượng cầu thủ ${removedPlayer[0].name}`);
                    }  else {
                        console.log("Không tìm thấy cầu thủ");
                    }
                    break;
                case 0:
                    alert("bạn đã thoát");
                    break;
                default: 
                    alert("lựa chọn không hợp lệ");
            }

        } while (choice != 0)
    </script>
</body>
</html>
