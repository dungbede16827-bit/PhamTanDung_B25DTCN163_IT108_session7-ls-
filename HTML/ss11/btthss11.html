<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let products = [
            { id: "P01", name: "Laptop MacBook Pro M3", price: 2000,category: "Laptop",inStock: true},
            { id: "P02", name: "Chuột không dây Logitech", price: 45,category: "Phụ kiện",inStock: false},
            { id: "P03", name: "Bàn phím cơ Keychron", price: 95,category: "Phụ kiện",inStock: false},
            { id: "P04", name: "màn hình Dell UltraSharp", price: 450,category: "Màn hình",inStock: true},
            { id: "P05", name: "Tai nghe Sony WH-1000XM5", price: 350,category: "Phụ kiện",inStock: true}
        ];

        let check = products.find(value => value.id === "P03" );
        if(check) {
            console.log(`id: ${check.id} | name: ${check.name} | price: ${check.price} | category : ${check.category} | Trạng thái ${check.inStock}`);
        } else {
            console.log("không tìm thấy sản phẩm ");
        }

        let check2 = products.some((value) => value.price < 0);
        if(check2) {
            console.log("Phát hiện sản phẩm chưa cập nhật giá");
        } else {
            console.log("Dữ liệu bảng giá hợp lệ");
        }

        function catalogDisplay(products) {
            products.forEach(element => {
                console.log(element.name + "-" + "Giá:" + element.price + "|"+"Trạng thái:" + (element.inStock ? "Còn Hàng" : "Hết hàng" ) )
                
            });
            
        }
        catalogDisplay(products);
    </script>
</body>
</html>
