<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Danh Sách Sản Phẩm Chợ Tết</h1>
<ul id="product-list">
    <!-- <li>
    <div class="product">
        <p>Tên sản phẩm: </p>
        <p>Giá sản phẩm: </p>
    </div>
    </li> -->
</ul>
<form id="product-form">
<input type="text" id="product-name" placeholder="Tên sản phẩm">
<input type="number" id="product-price" placeholder="Giá (VND)">
<button type="submit" onclick="handleAddProduct()">Thêm Sản Phẩm</button>
</form>
<script>
// let products = [
//   { id: 1, name: "Bánh Chưng", price: 150000 },
//   { id: 2, name: "Giò Lụa", price: 180000 },
//    { id: 3, name: "Cành Đào", price: 500000 },
//    { id: 4, name: "Mứt Tết", price: 120000 },
//    { id: 5, name: "Bao Lì Xì", price: 25000 },
//   { id: 6, name: "Dưa Hấu Tết", price: 80000 }
// ];
//  localStorage.setItem("products",JSON.stringify(products)) // lưu trữ dữ liệu vào localStorage dưới dạng chuỗi JSON

let products = JSON.parse(localStorage.getItem("products")) || [];
// localStorage.removeItem("")
// localStorage.clear(); 
function renderProduct() {} 
function handleAddProduct(event) {
    event.preventDefault(); // kh cho xóa trắng input
    let productNameInput = document.getElementById("product-name");
    let productPriceInput = document.getElementById("product-price");
    let newProductName = productNameInput.value;
    let newProductPrice = +productPriceInput.value;
    let newProduct = {
        // objeck 
        id: products.length !== 0 ? products[products.length - 1].id + 1 : 1,
        name: newProductName,
        price: (newProductPrice),
    };
    products.push(newProduct);
    localStorage.setItem("products",JSON.stringify(products));
    renderProduct();
}
renderProduct();

let productListElement = document.getElementById("product-list");
productListElement.innerHTML = ""; // xóa trắng danh sách sản phẩm trước khi render lại
console.log(productListElement)

products.forEach((product) => { 
    productListElement.innerHTML += `<li>
    <div class="product">
        <p>Tên sản phẩm: ${product.name}</p>
        <p>Giá sản phẩm: ${product.price}</p>
        <button onclick="handleDeleteProduct(${product.id})">Xóa</button>
    </div>
    </li>` ; // truy caapj vaof tat ca phan tu html trong id innerHTML += nối thêm sản phẩm vào
});
function handleDeleteProduct(productId) {
    //c1
    // // xóa sản phẩm khỏi mảng dựa trên id
    // let productIndex = products.findIndex((product) => product.id === productId);
    // if (productIndex !== -1) {
    //     products.splice(productIndex, 1); // xóa sản phẩm khỏi mảng
    //     renderProduct(); // render lại danh sách sản phẩm sau khi xóa
    // }
    //c2 
    products = products.filter((product) => product.id !== productId); // lọc ra sản phẩm cần xóa
    localStorage.setItem("products",JSON.stringify(products));
    renderProduct(); // render lại danh sách sản phẩm sau khi xóa

}
</script>

</body>
</html>
