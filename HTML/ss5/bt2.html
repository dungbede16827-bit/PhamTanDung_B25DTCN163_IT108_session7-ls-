<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let dem = 0 ;
        let sachTraMuon =[];
        let soSachTraMuon = Number(prompt("Hôm nay có bao nhiêu cuốn sách bị trả muộn? "));

        for(let i = 1 ; i <= soSachTraMuon ; i++) {
            let tenCuonBiTraMuon = prompt("Nhập lần lượt tên từng cuốn sách bị trả muộn");
            sachTraMuon.push(tenCuonBiTraMuon);
        }
        document.write("<br> tổng số sách bị trả muộn: "+ soSachTraMuon);
        document.write("<br> Danh sách sách bị trả muộn: <br>");
        for(let i = 0 ; i < soSachTraMuon  ; i++) {
            document.write((i+1) + ". " + sachTraMuon[i] + "<br>");
        }
        for(let i = 0 ; i < sachTraMuon.length  ; i++) {
            if(sachTraMuon[i].length > 20) { // length đếm xem có bao nhiêu kí tự cả khoảng trắng 
                dem++;
            }
        }
        document.write("Số lượng sách có tên dài hơn 20 ký tự:" + dem);
    </script>
</body>
</html>
