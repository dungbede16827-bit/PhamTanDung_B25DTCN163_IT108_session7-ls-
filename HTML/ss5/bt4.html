<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quản lý sách hư hỏng</title>
</head>
<body>
<script>
    let booksId = [];
    let booksName = [];
    let bookStatus = [];
    let soLuongSach;

    // Nhập số lượng sách
    do {
        soLuongSach = Number(prompt("Có bao nhiêu cuốn sách cần kiểm tra tình trạng hôm nay?"));
    } while (isNaN(soLuongSach) || soLuongSach <= 0);

    // Nhập danh sách ban đầu
    for (let i = 0; i < soLuongSach; i++) {
        alert("Nhập thông tin cho sách thứ " + (i + 1));

        let id;
        do {
            id = prompt("Nhập mã sách:");
        } while (!id || id.trim() === "");

        let name;
        do {
            name = prompt("Nhập tên sách:");
        } while (!name || name.trim() === "");

        let statusChoice;
        do {
            statusChoice = Number(prompt(
                "Nhập tình trạng ban đầu:\n" +
                "1 - Hỏng nhẹ\n" +
                "2 - Hỏng nặng\n" +
                "3 - Cần sửa gấp"
            ));
        } while (![1, 2, 3].includes(statusChoice));

        let statusText =
            statusChoice === 1 ? "Hỏng nhẹ" :
            statusChoice === 2 ? "Hỏng nặng" : "Cần sửa gấp";

        booksId.push(id);
        booksName.push(name);
        bookStatus.push(statusText);
    }

    // Hàm in danh sách
    function inDanhSach() {
        if (booksId.length === 0) {
            alert("Danh sách hiện đang rỗng");
            return;
        }
        let output = "Danh sách sách hiện tại:\n";
        for (let i = 0; i < booksId.length; i++) {
            output += (i + 1) + ". " +
                booksId[i] + " | " +
                booksName[i] + " | " +
                bookStatus[i] + "\n";
        }
        alert(output);
    }

    inDanhSach();

    // Menu chỉnh sửa
    let chon;
    do {
        chon = Number(prompt(
            "Bạn muốn làm gì?\n" +
            "1 - Sửa tình trạng sách\n" +
            "2 - Xóa sách\n" +
            "0 - Kết thúc và báo cáo"
        ));

        switch (chon) {
            case 1: {
                let maCanSua = prompt("Nhập mã sách cần sửa:");
                let index = booksId.indexOf(maCanSua);

                if (index === -1) {
                    alert("Không tìm thấy mã sách!");
                } else {
                    let luaChonMoi;
                    do {
                        luaChonMoi = Number(prompt(
                            "Chọn tình trạng mới:\n" +
                            "1 - Hỏng nhẹ\n" +
                            "2 - Hỏng nặng\n" +
                            "3 - Cần sửa gấp\n" +
                            "4 - Đã sửa xong\n" +
                            "5 - Loại bỏ"
                        ));
                    } while (![1, 2, 3, 4, 5].includes(luaChonMoi));

                    let trangThaiMoi =
                        luaChonMoi === 1 ? "Hỏng nhẹ" :
                        luaChonMoi === 2 ? "Hỏng nặng" :
                        luaChonMoi === 3 ? "Cần sửa gấp" :
                        luaChonMoi === 4 ? "Đã sửa xong" : "Loại bỏ";

                    bookStatus[index] = trangThaiMoi;
                    alert("Cập nhật thành công!");
                }
                inDanhSach();
                break;
            }

            case 2: {
                let maCanXoa = prompt("Nhập mã sách cần xóa:");
                let index = booksId.indexOf(maCanXoa);

                if (index === -1) {
                    alert("Không tìm thấy mã sách!");
                } else {
                    booksId.splice(index, 1);
                    booksName.splice(index, 1);
                    bookStatus.splice(index, 1);
                    alert("Đã xóa sách!");
                }
                inDanhSach();
                break;
            }

            case 0: {
                let daSuaXong = 0;
                let loaiBo = 0;

                for (let i = 0; i < bookStatus.length; i++) {
                    if (bookStatus[i] === "Đã sửa xong") daSuaXong++;
                    if (bookStatus[i] === "Loại bỏ") loaiBo++;
                }

                alert(
                    "BÁO CÁO CUỐI\n" +
                    "Tổng sách còn lại: " + booksId.length + "\n" +
                    "Đã sửa xong: " + daSuaXong + "\n" +
                    "Loại bỏ: " + loaiBo
                );
                break;
            }

            default:
                alert("Lựa chọn không hợp lệ!");
        }

    } while (chon !== 0);
</script>
</body>
</html>
