<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const players = [
            "Messi - Forward - 25 - 15",
            "Ronaldo - Forward - 30 - 10",
            "Neymar - Forward - 18 - 20",
            "De Bruyne - Midfielder - 8 - 25",
            "Kante - Midfielder - 2 - 5",
            "Van Dijk - Defender - 5 - 3",
            "Alisson - Goalkeeper - 0 - 1"
        ];
        function reportTopPerformers(minPerformance, players) {

            const result = players
                .map(p => {
                    const [name, position, goals, assists] = p.split(" - ");
                    const performance = Number(goals) + Number(assists);
                    return { name, performance };
                })
                .filter(p => p.performance >= minPerformance)
                .map(p => `${p.name}: ${p.performance}`);

            // In từng cầu thủ
            result.forEach(line => console.log(line));

            // Tính tổng hiệu suất
            const total = result
                .map(line => Number(line.split(": ")[1]))
                .reduce((sum, val) => sum + val, 0);

            console.log(`Tổng hiệu suất: ${total}`);
            return total;
        }
    </script>
</body>

</html>
