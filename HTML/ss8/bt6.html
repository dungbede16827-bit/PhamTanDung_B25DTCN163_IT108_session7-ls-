<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const players = [
            "Messi - Forward - 25 - 15 - 34",
            "Ronaldo - Forward - 30 - 10 - 38",
            "Neymar - Forward - 18 - 20 - 33",
            "De Bruyne - Midfielder - 8 - 25 - 35",
            "Kante - Midfielder - 2 - 5 - 36",
            "Van Dijk - Defender - 5 - 3 - 33",
            "Alisson - Goalkeeper - 0 - 1 - 37"
        ];

        reportByPosition(players);
        function reportByPosition(players) {

            // B1: chuyển chuỗi thành object
            const data = players.map(p => {
                const [name, position, goals, assists, matches] = p.split(" - ");
                return {
                    name,
                    position,
                    goals: +goals,
                    assists: +assists,
                    matches: +matches
                };
            });

            // B2: nhóm theo vị trí
            const grouped = data.reduce((acc, p) => {
                if (!acc[p.position]) acc[p.position] = [];
                acc[p.position].push(p);
                return acc;
            }, {});

            console.log("BÁO CÁO HIỆU SUẤT THEO VỊ TRÍ");

            // B3: duyệt từng nhóm
            Object.keys(grouped).forEach(position => {
                const playersInGroup = grouped[position];

                const totalGoals = playersInGroup.reduce((s, p) => s + p.goals, 0);
                const totalAssists = playersInGroup.reduce((s, p) => s + p.assists, 0);
                const totalMatches = playersInGroup.reduce((s, p) => s + p.matches, 0);
                const count = playersInGroup.length;

                const avgPerformance = ((totalGoals + totalAssists) / totalMatches).toFixed(2);

                console.log(position + ":");
                console.log(`- Số cầu thủ: ${count}`);
                console.log(`- Tổng bàn thắng: ${totalGoals}`);
                console.log(`- Tổng kiến tạo: ${totalAssists}`);
                console.log(`- Tổng số trận: ${totalMatches}`);
                console.log(`- Trung bình hiệu suất/trận: ${avgPerformance}`);
                console.log("");
            });

            // B4: tổng bàn thắng toàn đội
            const totalTeamGoals = data.reduce((sum, p) => sum + p.goals, 0);
            console.log(`Tổng bàn thắng toàn đội: ${totalTeamGoals}`);
        }
    </script>
</body>

</html>
